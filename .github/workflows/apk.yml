name: Gerar APK do Neon Nebula

# Roda quando você cria uma tag (ex.: v1.0.0) ou aperta o botão
# "Run workflow" na aba Actions do GitHub.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Preparar o SDK do Android
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Preparar o projeto Android
        working-directory: empacotar
        run: |
          npm install --no-audit --no-fund
          npm run preparar
          npx cap add android
          npx cap sync android

      - name: Gerar ícones e tela de abertura
        working-directory: empacotar
        continue-on-error: true
        run: npm run icones

      - name: Travar o jogo na vertical
        run: |
          MANIFEST=empacotar/android/app/src/main/AndroidManifest.xml
          if ! grep -q 'screenOrientation' "$MANIFEST"; then
            sed -i 's|android:name="\.MainActivity"|android:name=".MainActivity"\n            android:screenOrientation="portrait"|' "$MANIFEST"
          fi
          grep -n 'screenOrientation' "$MANIFEST" || echo "aviso: nao foi possivel travar a orientacao"

      - name: Preparar a chave de assinatura (se existir)
        id: chave
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > empacotar/android/chave.jks
            echo "assinado=sim" >> "$GITHUB_OUTPUT"
            echo "Chave encontrada: vai gerar um APK de release assinado."
          else
            echo "assinado=nao" >> "$GITHUB_OUTPUT"
            echo "Sem chave nos Secrets: vai gerar um APK de debug (instala normalmente)."
          fi

      - name: Compilar o APK assinado
        if: steps.chave.outputs.assinado == 'sim'
        working-directory: empacotar/android
        env:
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$PWD/chave.jks" \
            -Pandroid.injected.signing.store.password="$STORE_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"
          cp app/build/outputs/apk/release/app-release.apk ../../neon-nebula.apk

      - name: Compilar o APK de debug
        if: steps.chave.outputs.assinado == 'nao'
        working-directory: empacotar/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../../neon-nebula.apk

      - name: Guardar o APK na aba Actions
        uses: actions/upload-artifact@v4
        with:
          name: neon-nebula-apk
          path: neon-nebula.apk

      - name: Publicar o APK na página de Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: neon-nebula.apk
          name: Neon Nebula ${{ github.ref_name }}
          body: |
            ## Como instalar no Android

            1. Baixe o arquivo **neon-nebula.apk** aqui embaixo, pelo celular
            2. Toque no arquivo baixado
            3. Se o Android avisar sobre "fontes desconhecidas", toque em
               **Configurações → Permitir desta fonte** e volte
            4. Pronto: o jogo instala como um app normal, funciona offline

            No **iPhone**, use a versão web: abra a página do jogo no Safari e
            toque em **Compartilhar → Adicionar à Tela de Início**.
