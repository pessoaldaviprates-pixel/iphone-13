name: Publicar o jogo no GitHub Pages

# Sobe o jogo para pessoaldaviprates-pixel.github.io/iphone-13 a cada push
# no main. O "enablement: true" liga o Pages sozinho na primeira vez, então
# não precisa mexer em Settings.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# uma publicação por vez; se chegar outra, espera a de agora terminar
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Montar a pasta do site
        run: |
          set -e
          mkdir -p site
          # só o que o jogador precisa baixar — nada de fonte/, testes/ e afins
          cp index.html config.js sw.js versao.json manifest.json site/
          cp icon-192.png icon-512.png icon.svg site/
          cp baixar.html privacidade.html site/ 2>/dev/null || true
          touch site/.nojekyll
          echo "--- o que vai ao ar:"
          ls -la site/
          echo "--- versão:"
          grep -o 'const VERSAO = "[0-9.]*"' site/index.html | head -1
          # trava: nunca publicar apontando para o endereço de teste
          if grep -q "127.0.0.1" site/config.js; then
            echo "PERIGO: config.js está com o endereço de teste."
            exit 1
          fi

      - name: Preparar o Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Enviar a pasta
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
